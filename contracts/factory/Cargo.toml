[package]
name = "core-factory"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
